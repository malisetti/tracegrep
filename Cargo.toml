[package]
name = "tracegrep"
version = "0.2.0"
description = "jq-for-structured-logs: query JSON-lines and logfmt streams with a small expression language"
repository = "https://github.com/malisetti/tracegrep"
license = "MIT OR Apache-2.0"
keywords = ["log", "query", "jq", "logfmt", "json-lines"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
rust-version = "1.70"
edition = "2021"

[features]
bench = ["dep:criterion"]

[lib]
name = "tracegrep"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = ">=4.0, <=4.4.18", features = ["derive"] }
criterion = { version = "=0.3.6", optional = true }
regex = "=1.9.4"
serde = { version = "=1.0.171", features = ["derive"] }
serde_json = "=1.0.108"
thiserror = "=1.0.40"
# Pin runtime stack for rustc 1.70 (Cargo.lock resolver). Tokio uses only what `--follow`/tests need.
tokio = { version = "=1.28.2", features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }

[dev-dependencies]
assert_cmd = "=2.0.12"
insta = "=1.47.2"
predicates = "=3.0.4"
tempfile = "=3.10.1"

[[bench]]
name = "parse_bench"
harness = false
required-features = ["bench"]

[[bench]]
name = "eval_bench"
harness = false
required-features = ["bench"]
