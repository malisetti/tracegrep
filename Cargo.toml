[package]
name = "tracegrep"
version = "0.2.0"
description = "jq-for-structured-logs: query JSON-lines and logfmt streams with a small expression language"
repository = "https://github.com/malisetti/tracegrep"
license = "MIT OR Apache-2.0"
keywords = ["log", "query", "jq", "logfmt", "json-lines"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
rust-version = "1.70"
edition = "2021"

[lib]
name = "tracegrep"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5"
predicates = "3"
tempfile = "3"

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "eval_bench"
harness = false
